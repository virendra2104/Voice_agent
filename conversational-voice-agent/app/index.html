<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spatial Voice Console</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --panel-bg: #111115;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --user-bubble: #1f2029;
            --bot-bubble: #251e3d;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .console-container {
            width: 440px;
            height: 680px;
            background: var(--panel-bg);
            border: 1px solid #27272a;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header Segment */
        .console-header {
            padding: 1.5rem;
            border-bottom: 1px solid #27272a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141419;
        }

        .identity-cluster h3 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; }
        .identity-cluster span { font-size: 0.75rem; color: var(--text-muted); }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: #1e1e24;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #3f3f46;
        }

        .status-dot { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; }
        .status-dot.active { background-color: #10b981; box-shadow: 0 0 10px #10b981; animation: pulse 1.8s infinite; }

        /* Dialog/Chat Display Feed */
        .chat-feed {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        /* Message Bubbles custom formatting */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; animation: slideIn 0.25s ease-out; }
        .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .msg-wrapper.bot { align-self: flex-start; align-items: flex-start; }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }
        .user .msg-bubble { background: var(--user-bubble); color: var(--text-main); border-bottom-right-radius: 4px; border: 1px solid #3f3f46; }
        .bot .msg-bubble { background: var(--bot-bubble); color: #e0e7ff; border-bottom-left-radius: 4px; border: 1px solid #4338ca; }

        .msg-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; padding: 0 4px; }

        /* Footer Control Platform */
        .control-panel { padding: 1.5rem; border-top: 1px solid #27272a; background: #141419; }
        
        button {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }
        button:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        button:disabled { background-color: #27272a; color: var(--text-muted); cursor: not-allowed; box-shadow: none; transform: none; }
        button.connected { background-color: #dc2626; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2); }
        button.connected:hover { background-color: #b91c1c; }

        /* Custom Scrollbar */
        .chat-feed::-webkit-scrollbar { width: 5px; }
        .chat-feed::-webkit-scrollbar-track { background: transparent; }
        .chat-feed::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }

        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="console-container">
    <div class="console-header">
        <div class="identity-cluster">
            <h3>Mona AI</h3>
            <span>Voice Assistant Pipeline</span>
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>
    
    <div class="chat-feed" id="chatFeed">
        <div class="msg-wrapper bot">
            <div class="msg-bubble">Click connect call to initialize conversational track streaming.</div>
            <div class="msg-meta">System Console</div>
        </div>
    </div>
    
    <div class="control-panel">
        <button id="connectBtn">Connect Session</button>
    </div>
</div>

<script>
    let room;
    let activeSpeechMap = new Map(); // Tracks live update element references for typing frames

    function getLiveKitSDK() {
        const sdk = window.LivekitClient || window.LiveKitClient;
        if (!sdk) throw new Error("LiveKit SDK reference could not be mapped safely.");
        return sdk;
    }

    async function startVoiceSession() {
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const chatFeed = document.getElementById('chatFeed');

        connectBtn.disabled = true;
        statusText.innerText = "Connecting...";

        const roomName = "voice-room-" + Math.random().toString(36).substring(7);
        const identity = "user-" + Math.random().toString(36).substring(7);

        try {
            const LK = getLiveKitSDK();

            const response = await fetch('/api/get-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_name: roomName, identity: identity })
            });
            
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Failed token sync.");

            room = new LK.Room({ adaptiveStream: true, dynacast: true });

            // Hook for playing back received audio streams
            room.on(LK.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === 'audio') {
                    const element = track.attach();
                    document.body.appendChild(element);
                }
            });

            // CRITICAL SYSTEM EXTENSION: Listen directly to real-time agent/user pipeline transcription tracks
            room.on(LK.RoomEvent.TranscriptionReceived, (transcripts, participant) => {
                transcripts.forEach(trans => {
                    // Check if participant is the voice agent vs local UI user identity
                    const isBot = participant ? participant.identity.startsWith("agent-") || participant.isAgent : false;
                    const speakerType = isBot ? "bot" : "user";
                    const speakerName = isBot ? "Mona" : "You";

                    handleIncomingTranscript(trans.id, trans.text, speakerType, speakerName);
                });
            });

            await room.connect(data.server_url, data.token);
            await room.localParticipant.setMicrophoneEnabled(true);

            // Clean UI transition
            chatFeed.innerHTML = ''; 
            appendSystemMessage("Secure voice encryption stream connected.");

            statusText.innerText = "Online";
            statusDot.classList.add('active');
            
            connectBtn.innerText = "End Session";
            connectBtn.classList.add('connected');
            connectBtn.onclick = disconnectSession;
            connectBtn.disabled = false;

        } catch (error) {
            console.error(error);
            appendSystemMessage("Connection pipeline failed: " + error.message);
            statusText.innerText = "Disconnected";
            connectBtn.disabled = false;
            connectBtn.innerText = "Connect Session";
        }
    }

    function handleIncomingTranscript(id, text, type, name) {
        const chatFeed = document.getElementById('chatFeed');
        
        // If it's a continuing speech frame item, update the bubble contents in real time
        if (activeSpeechMap.has(id)) {
            const bubble = activeSpeechMap.get(id);
            bubble.innerText = text;
        } else {
            // Build new structured bubble frame segment
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${type}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerText = text;
            
            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            meta.innerText = name;
            
            wrapper.appendChild(bubble);
            wrapper.appendChild(meta);
            chatFeed.appendChild(wrapper);
            
            activeSpeechMap.set(id, bubble);
        }
        
        // Keep scroll index focused downward automatically
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function appendSystemMessage(text) {
        const chatFeed = document.getElementById('chatFeed');
        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper bot';
        wrapper.innerHTML = `<div class="msg-bubble" style="background:#18181b; border-color:#27272a; color:#a1a1aa;">${text}</div><div class="msg-meta">System</div>`;
        chatFeed.appendChild(wrapper);
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    async function disconnectSession() {
        const connectBtn = document.getElementById('connectBtn');
        if (room) {
            await room.disconnect();
        }
        activeSpeechMap.clear();
        document.getElementById('statusDot').classList.remove('active');
        document.getElementById('statusText').innerText = "Disconnected";
        
        connectBtn.innerText = "Connect Session";
        connectBtn.classList.remove('connected');
        connectBtn.onclick = startVoiceSession;
        appendSystemMessage("Session terminated by client.");
    }

    document.getElementById('connectBtn').onclick = startVoiceSession;
</script>
</body>
</html>
